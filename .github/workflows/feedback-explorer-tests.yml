name: FeedbackExplorer Tests

on:
  push:
    branches:
      - feat/feedback-explorer-fix
      - feat/feedback-diagnostics-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run FeedbackExplorer policy and diagnostics tests
        working-directory: ARC-AGI-3-Agents
        run: python -m unittest discover -s tests -p "test_feedback_*.py" -v
