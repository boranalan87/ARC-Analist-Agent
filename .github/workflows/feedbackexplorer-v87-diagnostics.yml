name: Verify isolated FeedbackExplorer V8.7 alignment diagnostics

on:
  push:
    branches:
      - 'feat/feedback-explorer-v8-7-alignment-loss-diagnostics'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.ref == 'refs/heads/feat/feedback-explorer-v8-7-alignment-loss-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8.7 diagnostics branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V8.6 source and V8.7 inputs
        run: python upgrade_v87.py --check
      - name: Apply diagnostics-only V8.7 patch
        run: python upgrade_v87.py --apply
      - name: Compile modified Python files
        run: python -m compileall -q ARC-AGI-3-Agents/agents/templates ARC-AGI-3-Agents/tests
      - name: Run all FeedbackExplorer regression tests
        working-directory: ARC-AGI-3-Agents
        run: python -m unittest discover -s tests -p 'test_feedback_*.py' -v
      - name: Commit V8.7 only if every test passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARC-AGI-3-Agents/agents/templates/ls20_visual_planner.py \
                  ARC-AGI-3-Agents/agents/templates/feedback_explorer.py \
                  ARC-AGI-3-Agents/tests/test_feedback_runtime_v8_1.py \
                  ARC-AGI-3-Agents/tests/test_feedback_v8_7_alignment_diagnostics.py
          if git diff --cached --quiet; then
            echo 'No diagnostics changes found.'
          else
            git commit -m 'test: V8.7 LS20 alignment-loss tracing [skip ci]'
            git push origin HEAD:'feat/feedback-explorer-v8-7-alignment-loss-diagnostics'
          fi
