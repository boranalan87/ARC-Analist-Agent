name: LS20 Colab replay validation
on:
  push:
    branches: ["feat/ls20-colab-replay"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (does not need ARC packages)
        run: python -m unittest discover -s tests -p 'test_ls20_routes.py'
      - name: Python syntax
        run: python -m py_compile tools/ls20_replay.py
      - name: Dependency security audit
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt
      - name: Manual acceptance criteria
        run: |
          echo 'No production deployment, score promotion or leaderboard submission performed.'
          echo 'LS20 local replay must be separately executed in compatible local ARC environment.'
