name: LS20 Colab replay validation

on:
  push:
    branches:
      - "feat/ls20-colab-replay-from-feat/feedback-explorer-v9-8-shortest-visible-retry"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f tools/ls20_replay.py
          test -f tests/test_ls20_routes.py

      - name: Run LS20 unit tests
        run: |
          python -m unittest discover -s tests -p "test_ls20_routes.py" -v

      - name: Check Python syntax
        run: |
          python -m py_compile tools/ls20_replay.py
          python -m py_compile tests/test_ls20_routes.py

      - name: Dependency security audit
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt

      - name: Acceptance criteria
        if: always()
        run: |
          echo "Production deployment is not performed."
          echo "No ARC leaderboard submission is performed."
          echo "Local LS20 replay requires separate verification."
