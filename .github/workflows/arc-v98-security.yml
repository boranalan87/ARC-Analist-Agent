        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit

      - name: Scan Python source
        run: |
          bandit -r runtime ARC-AGI-3-Agents \
            -ll -x '*/tests/*'

  python-tests:
    name: Python Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: |
          python -m compileall -q runtime ARC-AGI-3-Agents

      - name: Run FeedbackExplorer regression tests
        working-directory: ARC-AGI-3-Agents
        run: |
          python -m unittest discover \
            -s tests -p 'test_feedback_*.py' -v

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
