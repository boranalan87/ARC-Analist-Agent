name: Verify isolated FeedbackExplorer V9.1 pre-switch approaches

on:
  push:
    branches:
      - 'feat/feedback-explorer-v9-1-pre-switch-route-planning'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.ref == 'refs/heads/feat/feedback-explorer-v9-1-pre-switch-route-planning'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated V9.1 branch
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V9.0 baseline and V9.1 branch
        run: python upgrade_v91.py --check
      - name: Patch bounded pre-switch approach experiment
        run: python upgrade_v91.py --apply
      - name: Compile Python sources and tests
        run: python -m compileall -q ARC-AGI-3-Agents/agents/templates ARC-AGI-3-Agents/tests
      - name: All regression tests without ARC game access
        working-directory: ARC-AGI-3-Agents
        run: python -m unittest discover -s tests -p 'test_feedback_*.py' -v
      - name: Commit tested V9.1 only to isolated feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARC-AGI-3-Agents/agents/templates/ls20_visual_planner.py \
                  ARC-AGI-3-Agents/agents/templates/feedback_explorer.py \
                  ARC-AGI-3-Agents/tests/test_feedback_v9_0_transition_learning.py \
                  ARC-AGI-3-Agents/tests/test_feedback_v9_1_pre_switch_route.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'feat: V9.1 bounded pre-switch route alternatives [skip ci]'
            git push origin HEAD:'feat/feedback-explorer-v9-1-pre-switch-route-planning'
          fi
