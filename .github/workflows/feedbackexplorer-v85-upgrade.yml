name: Apply FeedbackExplorer V8.5 on GitHub

on:
  push:
    branches:
      - 'feat/feedback-explorer-v8-5-rotation-state-from-feat/feedback-explorer-v8-4-visual-route-recovery'

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.ref == 'refs/heads/feat/feedback-explorer-v8-5-rotation-state-from-feat/feedback-explorer-v8-4-visual-route-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only V8.5 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12 on GitHub runner (no PC installation needed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply V8.5 only once
        run: |
          if grep -q 'AGENT_VERSION = "8.5"' ARC-AGI-3-Agents/agents/templates/feedback_explorer.py; then
            echo 'V8.5 sources already present.'
          else
            python upgrade_v85.py --check
            python upgrade_v85.py --apply
          fi

      - name: Run all FeedbackExplorer tests
        working-directory: ARC-AGI-3-Agents
        run: |
          python -m unittest discover -s tests -p 'test_feedback_*.py' -v

      - name: Commit only verified V8.5 changes back to V8.5 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ARC-AGI-3-Agents/agents/templates/feedback_explorer.py \
            ARC-AGI-3-Agents/agents/templates/ls20_visual_planner.py \
            ARC-AGI-3-Agents/tests/test_feedback_runtime_v8_1.py \
            ARC-AGI-3-Agents/tests/test_feedback_v8_5_rotation_state.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: FeedbackExplorer V8.5 switch cycle diagnostics [skip ci]'
            git push origin HEAD:'feat/feedback-explorer-v8-5-rotation-state-from-feat/feedback-explorer-v8-4-visual-route-recovery'
          fi
